<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — ATOMY by Anna Yakovleva</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<section class="page-404">
<div>
<div class="page-404-code">404</div>
<h1 class="page-hero-title" data-i18n="page_404_title" style="margin-top:16px">Страница не найдена</h1>
<p class="page-hero-sub" data-i18n="page_404_sub" style="margin:16px auto 32px">Похоже, такой страницы не существует или она ещё не готова. Вернитесь на главную — там всё самое важное.</p>
<a href="/" class="btn btn-primary" data-i18n="back_to_home">На главную</a>
</div>
</section>

<script>
fetch('/js/translations.json')
  .then(res => res.json())
  .then(data => {
    const lang = localStorage.getItem('atomy_lang') || 'ru';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (data[lang] && data[lang][key]) el.textContent = data[lang][key];
    });
  })
  .catch(err => console.error('Не удалось загрузить переводы:', err));
</script>
</body>
</html>
